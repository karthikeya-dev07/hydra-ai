version: '3.9'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - YOLO_MODEL_PATH=yolo11n.pt
      - AI_DEVICE=cpu
    volumes:
      - ./ai:/app/ai
      - ./datasets:/app/datasets

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
